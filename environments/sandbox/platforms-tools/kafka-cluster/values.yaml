cluster:
  name: shoplite-kafka
  namespace: kafka
  kafkaVersion: 3.8.0
  replicas: 1
  listeners:
    - name: plain
      port: 9092
      type: internal
      tls: false
  config:
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1
    default.replication.factor: 1
    min.insync.replicas: 1
  storage:
    type: ephemeral
  zookeeper:
    replicas: 1
    storage:
      type: ephemeral

entityOperator:
  topicOperator:
    enabled: true
  userOperator:
    enabled: true

topics:
  - name: shoplite.order-events
    partitions: 3
    replicas: 1
    config:
      retention.ms: 604800000
  - name: shoplite.inventory-events
    partitions: 3
    replicas: 1
    config:
      retention.ms: 604800000
