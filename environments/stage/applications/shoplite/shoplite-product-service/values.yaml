name: shoplite-product-service
namespace: shoplite-stage

labels:
  app: shoplite-product-service
  application: shoplite
  team: backend
  app.kubernetes.io/part-of: shoplite
  app.kubernetes.io/instance: stage

annotations:
  reloader.stakater.com/auto: "true"

replicaCount: 1

image:
  repository: ghcr.io/shoplite-project/shoplite-product-service
  tag: stage-latest
  pullPolicy: Always

envFromConfigMaps:
  - shoplite-global-config
  - shoplite-stage-config
  - shoplite-product-service-config

containerPort: 3000

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 3000

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false

serviceAccount:
  create: true

ingress:
  enabled: false

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics
  port: http
