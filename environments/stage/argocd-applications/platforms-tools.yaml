global:
  repoURL: "https://github.com/ShopLite-Project/Kubernetes-ArgoCD-Deployments"
  targetRevision: main
  destinationServer: "https://kubernetes.default.svc"
  argocdNamespace: argocd
  project: platform-tools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Validate=false
      - ApplyOutOfSyncOnly=true

applications:
  - name: cert-manager-stage
    enabled: true
    namespace: cert-manager
    syncWave: "1"
    sources:
      - repoURL: "https://github.com/ShopLite-Project/Kubernetes-ArgoCD-Deployments"
        targetRevision: main
        ref: values
      - repoURL: "https://charts.jetstack.io"
        chart: cert-manager
        targetRevision: "v1.18.2"
        helm:
          releaseName: cert-manager
          valueFiles:
            - $values/environments/stage/platforms-tools/cert-manager/values.yaml

  - name: external-dns-stage
    enabled: true
    namespace: external-dns
    syncWave: "2"
    sources:
      - repoURL: "https://github.com/ShopLite-Project/Kubernetes-ArgoCD-Deployments"
        targetRevision: main
        ref: values
      - repoURL: "https://kubernetes-sigs.github.io/external-dns"
        chart: external-dns
        targetRevision: "1.15.0"
        helm:
          releaseName: external-dns
          valueFiles:
            - $values/environments/stage/platforms-tools/external-dns/values.yaml

  - name: traefik-stage
    enabled: true
    namespace: traefik
    syncWave: "3"
    sources:
      - repoURL: "https://github.com/ShopLite-Project/Kubernetes-ArgoCD-Deployments"
        targetRevision: main
        ref: values
      - repoURL: "https://traefik.github.io/charts"
        chart: traefik
        targetRevision: "34.3.0"
        helm:
          releaseName: traefik
          valueFiles:
            - $values/environments/stage/platforms-tools/traefik/values.yaml

  - name: argocd-stage
    enabled: false
    namespace: argocd
    syncWave: "4"
    sources:
      - repoURL: "https://github.com/ShopLite-Project/Kubernetes-ArgoCD-Deployments"
        targetRevision: main
        ref: values
      - repoURL: "https://argoproj.github.io/argo-helm"
        chart: argo-cd
        targetRevision: "7.8.2"
        helm:
          releaseName: argocd
          valueFiles:
            - $values/environments/stage/platforms-tools/argocd/values.yaml

  - name: kafka-operator-stage
    enabled: false
    namespace: kafka
    syncWave: "6"
    sources:
      - repoURL: "https://github.com/ShopLite-Project/Kubernetes-ArgoCD-Deployments"
        targetRevision: main
        ref: values
      - repoURL: "https://strimzi.io/charts/"
        chart: strimzi-kafka-operator
        targetRevision: "0.45.0"
        helm:
          releaseName: strimzi-kafka-operator
          valueFiles:
            - $values/environments/stage/platforms-tools/kafka-operator/values.yaml

  - name: monitoring-stage
    enabled: false
    namespace: monitoring
    syncWave: "5"
    sources:
      - repoURL: "https://github.com/ShopLite-Project/Kubernetes-ArgoCD-Deployments"
        targetRevision: main
        ref: values
      - repoURL: "https://prometheus-community.github.io/helm-charts"
        chart: kube-prometheus-stack
        targetRevision: "72.6.2"
        helm:
          releaseName: monitoring
          valueFiles:
            - $values/environments/stage/platforms-tools/monitoring/values.yaml

  - name: kafka-cluster-stage
    enabled: false
    namespace: kafka
    syncWave: "7"
    path: helm-charts/platforms-tools/kafka-cluster
    helm:
      releaseName: kafka-cluster
      valueFiles:
        - environments/stage/platforms-tools/kafka-cluster/values.yaml
