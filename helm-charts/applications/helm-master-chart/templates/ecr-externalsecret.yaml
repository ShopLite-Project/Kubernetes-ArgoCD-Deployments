{{- if and .Values.ecrExternalSecret.enabled .Values.ecrExternalSecret.createSharedResources }}
---
# ExternalSecret to fetch AWS credentials from Vault (shared across all apps in namespace)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aws-ecr-credentials
  namespace: {{ .Values.namespace | default "default" }}
  labels:
    {{- include "master-chart.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.ecrExternalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.ecrExternalSecret.secretStoreRef.name }}
    kind: {{ .Values.ecrExternalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: aws-ecr-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.ecrExternalSecret.remoteRef.key }}
        property: {{ .Values.ecrExternalSecret.remoteRef.accessKeyIdProperty }}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.ecrExternalSecret.remoteRef.key }}
        property: {{ .Values.ecrExternalSecret.remoteRef.secretAccessKeyProperty }}
---
# CronJob to refresh ECR token and create docker registry secret
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-token-refresh
  namespace: {{ .Values.namespace | default "default" }}
  labels:
    {{- include "master-chart.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.ecrExternalSecret.cronSchedule | default "0 */10 * * *" | quote }}
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: {{ .Values.name }}
          restartPolicy: OnFailure
          containers:
            - name: ecr-token-refresh
              image: amazon/aws-cli:latest
              envFrom:
                - secretRef:
                    name: aws-ecr-credentials
              env:
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.ecrExternalSecret.ecrRegion | quote }}
                - name: ECR_REGISTRY
                  value: {{ .Values.ecrExternalSecret.ecrRegistry | quote }}
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  yum install -y kubectl || curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && chmod +x kubectl && mv kubectl /usr/local/bin/
                  TOKEN=$(aws ecr get-login-password --region ${AWS_DEFAULT_REGION})
                  kubectl delete secret ecr-registry-secret --namespace=${NAMESPACE} --ignore-not-found
                  kubectl create secret docker-registry ecr-registry-secret \
                    --docker-server=${ECR_REGISTRY} \
                    --docker-username=AWS \
                    --docker-password=${TOKEN} \
                    --namespace=${NAMESPACE}
                  echo "ECR registry secret refreshed successfully"
---
# Initial Job to create ECR secret on install
apiVersion: batch/v1
kind: Job
metadata:
  name: ecr-token-init
  namespace: {{ .Values.namespace | default "default" }}
  labels:
    {{- include "master-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      serviceAccountName: {{ .Values.name }}
      restartPolicy: OnFailure
      containers:
        - name: ecr-token-init
          image: amazon/aws-cli:latest
          envFrom:
            - secretRef:
                name: aws-ecr-credentials
          env:
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.ecrExternalSecret.ecrRegion | quote }}
            - name: ECR_REGISTRY
              value: {{ .Values.ecrExternalSecret.ecrRegistry | quote }}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /bin/sh
            - -c
            - |
              set -e
              yum install -y kubectl || curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && chmod +x kubectl && mv kubectl /usr/local/bin/
              
              # Wait for aws-ecr-credentials secret to be ready
              for i in $(seq 1 30); do
                if kubectl get secret aws-ecr-credentials --namespace=${NAMESPACE} > /dev/null 2>&1; then
                  echo "AWS credentials secret is ready"
                  break
                fi
                echo "Waiting for aws-ecr-credentials secret..."
                sleep 5
              done
              
              TOKEN=$(aws ecr get-login-password --region ${AWS_DEFAULT_REGION})
              kubectl delete secret ecr-registry-secret --namespace=${NAMESPACE} --ignore-not-found
              kubectl create secret docker-registry ecr-registry-secret \
                --docker-server=${ECR_REGISTRY} \
                --docker-username=AWS \
                --docker-password=${TOKEN} \
                --namespace=${NAMESPACE}
              echo "ECR registry secret created successfully"
{{- end }}
